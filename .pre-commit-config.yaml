# Pre-commit hooks for code quality
# Install: pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ==========================================================================
  # General File Checks
  # ==========================================================================
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    exclude: \.md$
  - id: end-of-file-fixer
    exclude: \.ipynb$
  - id: check-yaml
    args: [--unsafe]        # Allow custom YAML tags
  - id: check-json
  - id: check-toml
  - id: check-added-large-files
        # INCREASED LIMIT: 100MB (GitHub's limit) to allow model checkpoints
    args: [--maxkb=100000]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    args: [--fix=lf]
    files: \.(py|md|yaml|yml|toml|json|txt)$
  - id: detect-private-key
  - id: check-ast
  - id: debug-statements
  - id: name-tests-test
    args: [--pytest-test-first]

  # ==========================================================================
  # Python Formatting & Linting (Black + Ruff)
  # ==========================================================================
- repo: https://github.com/psf/black
  rev: 26.1.0
  hooks:
  - id: black
    language_version: python3.10
    args: [--line-length=88]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.14.13
  hooks:
  - id: ruff
        # This will auto-fix imports (isort) and simple style issues
    args: [--fix, --exit-non-zero-on-fix]

  # ==========================================================================
  # Type Checking (MyPy)
  # ==========================================================================
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v1.19.1
  hooks:
  - id: mypy
    args: [--ignore-missing-imports, --explicit-package-bases]
    additional_dependencies:
    - types-PyYAML
    - types-requests
          # Exclude tests/notebooks to speed up commits
    - tomli
    exclude: tests/|notebooks/

  # ==========================================================================
  # Security (Bandit)
  # ==========================================================================
- repo: https://github.com/PyCQA/bandit
  rev: 1.9.3
  hooks:
  - id: bandit
    args: [-c, pyproject.toml]
    additional_dependencies: ['bandit[toml]']
    exclude: tests/|notebooks/

  # ==========================================================================
  # Jupyter Notebooks (Strip Output + Quality)
  # ==========================================================================
- repo: https://github.com/kynan/nbstripout
  rev: 0.9.0
  hooks:
  - id: nbstripout
        # Keeps repo small by removing graph outputs/images from notebooks
    args: [--extra-keys, metadata.kernelspec metadata.language_info]

- repo: https://github.com/nbQA-dev/nbQA
  rev: 1.7.1
  hooks:
  - id: nbqa-black
    additional_dependencies: [black==24.1.1]
  - id: nbqa-ruff
    additional_dependencies: [ruff==0.1.13]
    args: [--fix, --ignore=E402]

  # ==========================================================================
  # Documentation & Configs
  # ==========================================================================
- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.47.0
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013]            # MD013 = Disable line length limit

# ============================================================================
# Global Configuration
# ============================================================================
default_language_version:
  python: python3.10

# Global exclude list (Regex)
exclude: |
  (?x)^(
      data/.*|
      \.venv/.*|
      venv/.*|
      \.git/.*|
      \.mypy_cache/.*|
      \.pytest_cache/.*|
      \.ruff_cache/.*|
      __pycache__/.*|
      .*\.egg-info/.*
  )$

default_stages: [pre-commit]
fail_fast: false
